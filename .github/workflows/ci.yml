name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Format
        run: test -z "$(gofmt -l ./internal ./services ./cmd)"
      - name: Vet
        run: go vet ./internal/... ./services/... ./cmd/...
      - name: Test
        run: go test ./internal/... ./services/... ./cmd/...

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [go, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Build application images
        run: |
          docker build -f services/ingestion-api/Dockerfile -t pulselog/ingestion-api:ci .
          docker build -f services/log-processor/Dockerfile -t pulselog/log-processor:ci .
          docker build -f services/query-api/Dockerfile -t pulselog/query-api:ci .
          docker build -f cmd/migrate/Dockerfile -t pulselog/migrate:ci .
          docker build -f apps/dashboard/Dockerfile -t pulselog/dashboard:ci apps/dashboard

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose (local)
        run: docker compose -f infrastructure/docker-compose.yml config >/dev/null
      - name: Compose (production-like)
        run: docker compose --env-file .env.prod.example -f infrastructure/docker-compose.prod.yml config >/dev/null
      - name: Kubernetes kustomize
        run: |
          docker run --rm -v "$PWD:/src" -w /src registry.k8s.io/kustomize/kustomize:v5.4.3 build deploy/kubernetes >/tmp/pulselog-k8s.yaml
          test -s /tmp/pulselog-k8s.yaml
      - name: Kubernetes kubeconform
        run: |
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/yannh/kubeconform:v0.6.7 -strict -ignore-missing-schemas deploy/kubernetes

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (enforced)
        run: docker run --rm -v "$PWD:/path" ghcr.io/gitleaks/gitleaks:v8.24.2 detect --source /path --verbose --redact --no-git
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Go vulnerability scan (advisory)
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./internal/... ./services/... ./cmd/...
      - name: npm audit (advisory)
        continue-on-error: true
        working-directory: apps/dashboard
        run: npm ci && npm audit --audit-level=high
      - name: Build images for scan
        run: |
          docker build -f services/ingestion-api/Dockerfile -t pulselog/ingestion-api:ci .
          docker build -f apps/dashboard/Dockerfile -t pulselog/dashboard:ci apps/dashboard
      - name: Trivy image scan (advisory)
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pulselog/ingestion-api:ci
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
