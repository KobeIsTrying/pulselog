name: publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  ci-gate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci-gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: ingestion-api
            file: services/ingestion-api/Dockerfile
            context: .
          - name: log-processor
            file: services/log-processor/Dockerfile
            context: .
          - name: query-api
            file: services/query-api/Dockerfile
            context: .
          - name: migrate
            file: cmd/migrate/Dockerfile
            context: .
          - name: dashboard
            file: apps/dashboard/Dockerfile
            context: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
