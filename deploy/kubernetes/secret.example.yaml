# Example only. Do not apply this file with real values committed.
# Create the live secret from a sealed-secret / ExternalSecret / kubectl:
#   kubectl -n pulselog create secret generic pulselog-secrets \
#     --from-literal=JWT_SECRET=... \
#     --from-literal=POSTGRES_DSN=... \
#     --from-literal=CLICKHOUSE_PASSWORD=... \
#     --from-literal=REDIS_ADDR=redis.example.com:6379 \
#     --from-literal=KAFKA_BROKERS=broker-1:9092,broker-2:9092 \
#     --from-literal=CLICKHOUSE_ADDR=clickhouse.example.com:9000
apiVersion: v1
kind: Secret
metadata:
  name: pulselog-secrets
  namespace: pulselog
type: Opaque
stringData:
  JWT_SECRET: replace-me
  POSTGRES_DSN: postgres://pulselog:replace-me@postgres.example.com:5432/pulselog?sslmode=require
  CLICKHOUSE_PASSWORD: replace-me
  REDIS_ADDR: redis.example.com:6379
  KAFKA_BROKERS: broker-1:9092
  CLICKHOUSE_ADDR: clickhouse.example.com:9000
