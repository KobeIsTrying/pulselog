apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-api
  namespace: pulselog
  labels:
    app.kubernetes.io/name: pulselog
    app.kubernetes.io/component: query-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: query-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulselog
        app.kubernetes.io/component: query-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: query-api
          image: ghcr.io/pulselog/pulselog/query-api:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: QUERY_HTTP_ADDR
              value: ":8082"
          envFrom:
            - configMapRef:
                name: pulselog-config
            - secretRef:
                name: pulselog-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      terminationGracePeriodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: query-api
  namespace: pulselog
  labels:
    app.kubernetes.io/component: query-api
spec:
  selector:
    app.kubernetes.io/component: query-api
  ports:
    - name: http
      port: 8082
      targetPort: http
