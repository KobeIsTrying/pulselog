apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-processor
  namespace: pulselog
  labels:
    app.kubernetes.io/name: pulselog
    app.kubernetes.io/component: log-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: log-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulselog
        app.kubernetes.io/component: log-processor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: log-processor
          image: ghcr.io/pulselog/pulselog/log-processor:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: PROCESSOR_HTTP_ADDR
              value: ":8081"
            - name: PROCESSOR_SHUTDOWN_GRACE
              value: "15s"
          envFrom:
            - configMapRef:
                name: pulselog-config
            - secretRef:
                name: pulselog-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      terminationGracePeriodSeconds: 25
---
apiVersion: v1
kind: Service
metadata:
  name: log-processor
  namespace: pulselog
  labels:
    app.kubernetes.io/component: log-processor
spec:
  selector:
    app.kubernetes.io/component: log-processor
  ports:
    - name: http
      port: 8081
      targetPort: http
