apiVersion: batch/v1
kind: Job
metadata:
  name: pulselog-migrate
  namespace: pulselog
  labels:
    app.kubernetes.io/name: pulselog
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: migrate
          image: ghcr.io/pulselog/pulselog/migrate:main
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          envFrom:
            - configMapRef:
                name: pulselog-config
            - secretRef:
                name: pulselog-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
