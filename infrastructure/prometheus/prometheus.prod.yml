global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ingestion-api
    static_configs:
      - targets: ["ingestion-api:8080"]
  - job_name: log-processor
    static_configs:
      - targets: ["log-processor:8081"]
  - job_name: query-api
    static_configs:
      - targets: ["query-api:8082"]
