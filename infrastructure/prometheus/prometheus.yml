global:
  scrape_interval: 2s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ingestion-api
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: log-processor
    static_configs:
      - targets: ["host.docker.internal:8081"]
  - job_name: query-api
    static_configs:
      - targets: ["host.docker.internal:8082"]
